# 20-batch GPU/data-loading benchmark. No validation or calibration by design.
experiment_name: train_pix2pix_workers2_benchmark
data_root: data/M3Dsynth
metadata_dir: metadata/m3dsynth
output_dir: outputs/train_pix2pix_workers2_benchmark

split:
  train_set: train
  valid_set: valid
  test_set: test
  train_mods: [pix2pix]
  valid_mods: [pix2pix]
  test_mods: [cycle, diffusion]
  include_real: true

data:
  max_train_records: 256
  max_valid_records: 0
  record_subset_seed: 21

patches:
  patch_shape: [32, 32, 32]
  train_stride: [32, 32, 32]
  inference_stride: [16, 16, 16]
  positive_overlap_fraction: 0.05
  max_patches_per_volume: 32
  neg_per_pos: 5.0

model:
  name: simple_3d_cnn
  in_channels: 1
  num_classes: 1
  base_channels: 16
  dropout: 0.2

training:
  epochs: 1
  batch_size: 32
  max_patches_per_epoch: 640
  volume_cache_size: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  mixed_precision: true
  amp_dtype: bfloat16
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 1
  pin_memory: true
  seed: 21
  checkpoint_every_epoch: false

evaluation:
  calibrate_best: false
