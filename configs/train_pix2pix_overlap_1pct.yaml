# Ablation: lower the positive overlap threshold only; keep the binary target.
experiment_name: train_pix2pix_overlap_1pct_resnet18_medicalnet
data_root: data/M3Dsynth
metadata_dir: metadata/m3dsynth
output_dir: outputs/train_pix2pix_overlap_1pct_resnet18_medicalnet

split:
  train_set: train
  valid_set: valid
  test_set: test
  train_mods: [pix2pix]
  valid_mods: [pix2pix]
  test_mods: [cycle, diffusion]
  include_real: true

data:
  max_train_records: 256
  max_valid_records: 64
  record_subset_seed: 21

patches:
  patch_shape: [32, 32, 32]
  train_stride: [32, 32, 32]
  inference_stride: [16, 16, 16]
  positive_overlap_fraction: 0.01
  max_patches_per_volume: 32
  positive_patches_per_volume: 8
  positive_volume_fraction: 0.80
  max_valid_patches_per_volume: 64

model:
  name: resnet18_medicalnet
  in_channels: 1
  num_classes: 1
  medicalnet_weights: checkpoints/medicalnet/resnet_18_23dataset.pth
  dropout: 0.2  # Usato per ridurre l'overfitting.

training:
  epochs: 16
  loss: focal
  target: label
  batch_size: 32
  max_patches_per_epoch: 4096
  volume_cache_size: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  mixed_precision: true
  amp_dtype: bfloat16
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 1
  pin_memory: true
  early_stopping_patience: 5  # Stop dopo 5 epoche senza miglioramento dell'AP patch campionata.
  seed: 21
  checkpoint_every_epoch: true

evaluation:
  threshold_source: validation  # Mantenuta per compatibilita; la calibrazione usa la validation.
  detection_score: auto
  topk_fractions: [0.0001, 0.0005, 0.001, 0.005, 0.01]  # Medie dei voxel con score maggiore.
  report_examples_per_class: 2
  heatmap_aggregation: average  # Distribuisce lo score sui voxel e media le patch sovrapposte.
  calibration_batch_size: 32
  calibration_threshold_steps: 99
  calibrate_best: true
  lung_metrics: true
  localization_metrics: [f1, iou, voxel_auc, ap]  # Lista descrittiva; non guida il calcolo.
