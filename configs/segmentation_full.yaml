# MedicalNet segmentation protocol: full; independent outputs, shared percentile cache.
stage: full
output_dir: outputs/segmentation_full
metadata_dir: metadata/m3dsynth
manifest: outputs/segmentation_protocol/manifest.json
overfit_report: outputs/segmentation_overfit/gate.json
cache_dir: outputs/segmentation_protocol/cache
split:
  train_mods: [pix2pix]
  valid_mods: [pix2pix]
  test_mods: [cycle, diffusion]
model:
  name: resnet18_medicalnet_seg
  in_channels: 1
  num_classes: 1
  medicalnet_weights: checkpoints/medicalnet/resnet_18_23dataset.pth
patches:
  patch_shape: [64, 64, 64]
preprocessing:
  low: 1.0
  high: 99.0
  clip: false
training:
  seed: 21
  epochs: 16
  batch_size: 2
  accumulation_steps: 4
  encoder_lr: 0.00003
  decoder_lr: 0.0003
  weight_decay: 0.0001
  freeze_encoder_epochs: 2
  validation_interval: 2
  early_stopping_validations: 3
  num_workers: 4
  volume_cache_size: 2
baseline_report: outputs/segmentation_protocol/baseline_common/metrics.json
pilot_reports:
  - outputs/segmentation_pilot/evaluation/metrics.json
  - outputs/segmentation_pilot_clip/evaluation/metrics.json
pilot_baseline_report: outputs/segmentation_protocol/baseline_pilot/metrics.json
